<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação 01</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Avaliação 01</h1>
    <h2>Questão 01</h2>
    <input type = "number" id = "peso" placeholder = "Digite seu peso">
    <input type = "number" id = "altura" placeholder = "Digite sua altura">
    <button id = "calcularIMC">Calcular</button>
    <div id = "resultado1"></div>
    <hr>

    <h2>Questão 02</h2>
    <select id = "candidatos">
        <option value = "Candidato A">Candidato A</option>
        <option value = "Candidato B">Candidato B</option>
        <option value = "Candidato C">Candidato C</option>
    </select>
    <button id = "votar">Votar</button>
    <button id = "apurar">Apurar</button>
    <button id = "zerar">Zerar</button>
    <div id = "resultado2"></div>

    <h2>Questão 03</h2>
    <input type = "number" id = "valorTemp" placeholder = "Digite um valor">
    <select id = "temperatura">
        <option value = "paraFahrenheit">°C para °F</option>
        <option value = "paraCelsius">°F para °C</option>
    </select>
    <button id = "converter">Converter</button>
    <div id = "resultado3"></div>

    <h2>Questão 04</h2>
    <input type="number" id="valorGasto" placeholder="Digite um valor gasto">
    <button id="adicionarValor">Adicionar</button>
    <button id="exibirResumo">Exibir Resumo</button>
    <div id="resultado4"></div>
    
    <h2>Questão 05</h2>
    <input type="number" id="numero" placeholder="Digite um número">
    <button id="verificarNumero">Verificar</button>
    <div id="resultado5"></div>
</body>
</html>
